<!DOCTYPE html>
<html lang="az">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - ÉLORIA</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="selector.css">
</head>

<body>

  <div style="padding: 20px; max-width: 1200px; margin: 0 auto;">
    <a href="../index.html" style="text-decoration: none; color: #b99d76; font-weight: bold;">← ANA SƏHİFƏ</a>
  </div>

  <h1 id="page-title" style="text-align:center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px;">
    Products</h1>

  <div style="text-align: center; margin-bottom: 40px;" class="category-buttons">
    <button class="cat-btn" onclick="filterCategory('all')">Hamısı</button>
    <button class="cat-btn" onclick="filterCategory('cleanser')">CLEANSER</button>
    <button class="cat-btn" onclick="filterCategory('toner')">TONER</button>
    <button class="cat-btn" onclick="filterCategory('serum')">SERUM</button>
    <button class="cat-btn" onclick="filterCategory('moisturizer')">MOISTURIZER</button>
    <button class="cat-btn" onclick="filterCategory('spf')">SPF</button>
    <button class="cat-btn" onclick="filterCategory('self-care')">self-care</button>
    <button class="cat-btn" onclick="filterCategory('mask-care')">mask</button>
    <button class="cat-btn" onclick="filterCategory('hair-care')">hair-care</button>
    <button class="cat-btn" onclick="filterCategory('body-care')">body-care</button>
  </div>

  <div id="products" class="grid"
    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; padding: 0 20px;">
  </div>

  <script src="selector.js"></script>
</body>

</html>
