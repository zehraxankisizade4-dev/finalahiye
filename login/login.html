<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Eloria - Giriş</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <form id="loginForm">
    <h2>Giriş</h2>
    <input type="text" id="name" placeholder="Ad" required>
    <input type="text" id="surname" placeholder="Soyad" required>
    <input type="password" id="password" placeholder="Şifrə" required>
    
    <small class="password-hint">Min 8 simvol, böyük hərf, rəqəm və nöqtə olmalıdır.</small>
    
    <button type="submit">Daxil ol</button>
</form>
    <script src="login.js"></script>
</body>
</html>
